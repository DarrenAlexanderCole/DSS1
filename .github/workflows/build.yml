name: Build and test

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDSS1_BUILD_APP=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS app + tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Cache downloaded dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/src/app/DSS1_artefacts/Release/DSS1.app DSS1-macOS.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: DSS1-macOS
          path: DSS1-macOS.zip
          retention-days: 14
