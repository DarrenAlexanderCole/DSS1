name: Release (macOS)

# Pushing to the test-build branch builds the app, packages it as a disk image and publishes it as a
# GitHub pre-release (tagged v2.0.0-test.<run number>), so testers can download it without a GitHub account.

on:
  push:
    branches: [test-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish DSS1 for macOS
    runs-on: macos-15
    env:
      TAG: v2.0.0-test.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package disk image
        run: |
          APP=build/src/app/DSS1_artefacts/Release/DSS1.app
          lipo -info "$APP/Contents/MacOS/DSS1"
          # Not notarised yet: an ad-hoc signature lets macOS run it once the user allows it.
          codesign --force --deep --sign - "$APP"
          mkdir dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "DSS1" -srcfolder dmg -ov -format UDZO "DSS1-${TAG}.dmg"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "DSS1-${TAG}.dmg" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "DSS1 V2 test build ${TAG}" \
            --notes-file docs/TEST-BUILD.md
