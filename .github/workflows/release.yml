name: Release (macOS)

# Pushing to the test-build branch builds the app, packages it as a disk image and publishes it as a
# GitHub pre-release (tagged v2.1.0-test.<run number>), so testers can download it without a GitHub account.
# Running it by hand with a label (e.g. beta.1) publishes a beta instead: tagged v2.1.0-<label>, with the beta
# notes (docs/BETA.md), and marked as the repository's latest release so it's the one people find.

on:
  push:
    branches: [test-build]
  workflow_dispatch:
    inputs:
      label:
        description: "Release label, e.g. beta.1 (empty: a numbered test build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and publish DSS1 for macOS
    # GitHub is short of Apple-silicon Mac runners (jobs were cancelled unstarted); the Intel ones still build a
    # universal app.
    runs-on: macos-15-intel
    env:
      LABEL: ${{ github.event.inputs.label || format('test.{0}', github.run_number) }}
      TAG: v2.1.0-${{ github.event.inputs.label || format('test.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDSS1_BUILD_LABEL="${LABEL}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package disk image
        run: |
          APP=build/src/app/DSS1_artefacts/Release/DSS1.app
          lipo -info "$APP/Contents/MacOS/DSS1"
          # Not notarised yet: an ad-hoc signature lets macOS run it once the user allows it.
          codesign --force --deep --sign - "$APP"
          mkdir dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "DSS1" -srcfolder dmg -ov -format UDZO "DSS1-${TAG}.dmg"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.label }}" ]; then
            gh release create "$TAG" "DSS1-${TAG}.dmg" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "DSS1 V2 ${LABEL}" \
              --notes-file docs/BETA.md
          else
            gh release create "$TAG" "DSS1-${TAG}.dmg" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "DSS1 V2 test build ${TAG}" \
              --notes-file docs/TEST-BUILD.md
          fi
